services:
  opds:
    build:
      context: .
    container_name: abs-opds
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      # Set ABS_URL and OPDS_USERS in a local .env file (gitignored); see .env.example.
      - ABS_URL=${ABS_URL:-https://your-audiobookshelf-server.example}
      - OPDS_USERS=${OPDS_USERS:-demotest:CHANGE_ME_ABS_API_TOKEN:demo_password}
      - OPDS_PAGE_SIZE=20
      - SHOW_AUDIOBOOKS=true
      - SHOW_CHAR_CARDS=true
      # - OPDS_NO_AUTH=true
      # - ABS_NOAUTH_USERNAME=myuser
      # - ABS_NOAUTH_PASSWORD=mypassword
